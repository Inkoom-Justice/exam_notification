name: Exam Notification Checker

on:
  schedule:
    # Every 15 min, Mon–Sat, 07:00–19:00 Warsaw (CEST = UTC+2 → 05:00–17:00 UTC)
    - cron: '0,15,30,45 5-17 * * 1-6'
  workflow_dispatch:
    # Manual trigger from GitHub Actions UI

# ── CRITICAL: grant the token write access to push the sent-log ──
permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use a token with write permissions so git push works
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ./scripts

      - name: Run notification check
        env:
          SHEETS_URL:      ${{ secrets.SHEETS_URL }}
          EJS_PUBLIC_KEY:  ${{ secrets.EJS_PUBLIC_KEY }}
          EJS_SERVICE_ID:  ${{ secrets.EJS_SERVICE_ID }}
          EJS_TEMPLATE_ID: ${{ secrets.EJS_TEMPLATE_ID }}
          NOTIFY_MINUTES:  ${{ vars.NOTIFY_MINUTES || '60' }}
          EMAIL_DOMAIN:    ${{ vars.EMAIL_DOMAIN || 'regent.edu.pl' }}
          TIMEZONE:        ${{ vars.TIMEZONE || 'Europe/Warsaw' }}
        run: node notify.js
        working-directory: ./scripts

      - name: Commit updated sent-log
        run: |
          git config user.name  "Exam Notifier Bot"
          git config user.email "notifier@regent.edu.pl"
          git add data/sent-log.json
          # Only commit if the file actually changed (avoids empty commits)
          git diff --staged --quiet || git commit -m "chore: update sent-log [skip ci]"
          git push
