name: Exam Notification Checker

on:
  schedule:
    # Daily at 19:00 Warsaw time (17:00 UTC in summer CEST, 18:00 UTC in winter CET)
    # We run both times to be safe across DST transitions
    - cron: '0 17 * * 1-6'   # 19:00 CEST (UTC+2, summer)
    - cron: '0 18 * * 1-6'   # 19:00 CET  (UTC+1, winter)
  workflow_dispatch:          # Manual trigger from GitHub Actions UI

permissions:
  contents: write             # Required to push updated sent-log.json

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: scripts/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('scripts/package.json') }}

      - name: Install dependencies
        run: |
          cd scripts
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run notification engine
        env:
          SHEETS_URL:      ${{ secrets.SHEETS_URL }}
          EJS_PUBLIC_KEY:  ${{ secrets.EJS_PUBLIC_KEY }}
          EJS_SERVICE_ID:  ${{ secrets.EJS_SERVICE_ID }}
          EJS_TEMPLATE_ID: ${{ secrets.EJS_TEMPLATE_ID }}
          EMAIL_DOMAIN:    ${{ vars.EMAIL_DOMAIN || 'regent.edu.pl' }}
        run: node scripts/notify.js

      - name: Commit updated sent-log
        run: |
          git config user.name  "Exam Notifier Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent-log.json
          git diff --staged --quiet || git commit -m "chore: update sent-log [skip ci]"
          git push
